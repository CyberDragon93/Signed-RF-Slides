<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signed Rectified Flow · 1D playground</title>
  <link rel="stylesheet" href="playground.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <style>
    /* ---- page-specific: 1D anatomy stage --------------------------------- */
    #sv {
      width: 100%;
      aspect-ratio: 900 / 560;
      display: block;
    }

    #overlay {
      font-size: 13px; /* scaled down by JS on narrow stages; never above 13px */
    }

    .ov {
      position: absolute;
      pointer-events: none;
      line-height: 1.25;
      white-space: nowrap;
    }

    .ov-chip {
      display: inline-block;
      border-radius: 0.46em;
      background: rgba(255, 255, 255, 0.92);
      padding: 0.08em 0.54em 0.15em;
      border: 1px solid;
      font-size: 0.923em;
      font-weight: 650;
    }

    .ov-zero { color: #9d2d64; border-color: #9d2d64; }
    .ov-ghostb { color: #666666; border-color: #666666; }

    .ov-src { color: #253a88; font-size: 1em; font-weight: 650; }

    .ov-striptitle {
      color: #202124;
      font-size: 1em;
      font-weight: 650;
      transform: translateX(-50%);
    }

    .ov-zone {
      display: inline-block;
      padding: 0 0.38em 0.08em;
      border-radius: 0.46em;
      border: 1px solid;
      background: rgba(255, 255, 255, 0.92);
      font-size: 0.846em;
      font-weight: 700;
    }

    .ov-zonebox { transform: translateY(-50%); }

    .ov-callout {
      border: 1px solid #202124;
      background: #ffffff;
      border-radius: 0.46em;
      padding: 0.08em 0.69em 0.15em;
      font-size: 0.923em;
      font-weight: 650;
      color: #202124;
      transform: translate(-50%, -50%);
    }

    .ov-axis {
      color: var(--faint);
      font-size: 0.885em;
      transform: translateX(-50%);
    }

    .ov-legend {
      display: flex;
      gap: 1.23em;
      align-items: center;
      color: #536073;
      font-size: 0.923em;
      font-weight: 600;
      transform: translateX(-50%);
    }

    .ov-legend .lg-key {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .ov-legend .lg-chip {
      display: inline-flex;
      width: 1.33em;
      height: 1.33em;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 0.875em;
      font-weight: 800;
    }

    .ov-legend .lg-ghost { background: #9a9a9a; }
    .ov-legend .lg-neg { background: #e34a92; }
    .ov-legend .lg-note { font-weight: 500; }

    /* ---- controls: alpha detent ticks ------------------------------------ */
    .pg-range-wrap {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
    }

    .pg-range-wrap input[type='range'].pg-range { width: 100%; }

    .pg-range-wrap {
      padding-bottom: 14px;
    }

    .pg-ticks {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 24px;
      height: 16px;
      pointer-events: none;
    }

    .pg-ticks .tk {
      position: absolute;
      top: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transform: translateX(-50%);
    }

    .pg-ticks .tk i {
      width: 1px;
      height: 4px;
      background: rgba(48, 58, 73, 0.3);
    }

    .pg-ticks .tk b {
      font-family: var(--serif);
      font-size: 9.5px;
      font-weight: 600;
      font-style: normal;
      line-height: 1;
      color: var(--faint);
    }

    #speedChips { flex-wrap: nowrap; }
  </style>
</head>
<body>
  <header class="pg-header">
    <div class="pg-title">Signed Rectified Flow <span class="pg-title-sub">· 1D playground</span></div>
    <nav class="pg-nav">
      <a href="../">slides</a>
      <a href="2d.html">2D playground</a>
      <a href="https://arxiv.org/abs/2607.18516">paper</a>
    </nav>
  </header>

  <main class="pg-main">
    <div class="pg-stage" id="stage">
      <svg id="sv" viewBox="0 0 900 560" role="img" aria-label="Signed RF 1D anatomy"></svg>
      <div class="pg-layer" id="overlay">
        <div class="ov ov-src" id="ovSrc">&pi;&#8320; = N(0,1)</div>
        <div class="ov ov-striptitle" id="ovStripTitle"></div>
        <div class="ov" id="ovZero" style="display:none"><span class="ov-chip ov-zero" id="ovZeroChip">zero set</span></div>
        <div class="ov" id="ovGhost" style="display:none"><span class="ov-chip ov-ghostb">buffer boundary</span></div>
        <div class="ov" id="ovZones" style="inset:0"></div>
        <div class="ov ov-callout" id="ovCallout" style="display:none">pair production</div>
        <div class="ov ov-legend" id="ovLegend" style="display:none"></div>
        <div class="ov ov-axis" id="ovT0"></div>
        <div class="ov ov-axis" id="ovT1"></div>
      </div>
    </div>

    <aside class="pg-controls" id="controls">
      <div class="pg-group">
        <div class="pg-group-label">world</div>
        <div class="pg-chips" id="worldChips">
          <button class="pg-chip on" data-world="paper">paper</button>
          <button class="pg-chip" data-world="twin">twin</button>
          <button class="pg-chip" data-world="skew">skew</button>
          <button class="pg-chip" data-world="comb">comb</button>
          <button class="pg-chip" data-world="needle">needle</button>
          <button class="pg-chip" data-world="canyon">canyon</button>
          <button class="pg-chip" data-world="island">island</button>
        </div>
      </div>

      <div class="pg-group">
        <div class="pg-group-label">signed weight</div>
        <div class="pg-slider-row">
          <div class="pg-range-wrap">
            <input type="range" class="pg-range" id="alphaRange" min="0" max="4" step="0.05" value="0.85" aria-label="signed weight alpha">
            <div class="pg-ticks" id="alphaTicks"></div>
          </div>
          <div class="pg-readout" id="alphaReadout">&alpha; = 0.85</div>
        </div>
      </div>

      <div class="pg-group">
        <div class="pg-group-label">layers</div>
        <div class="pg-chips" id="layerChips">
          <button class="pg-chip pg-toggle on" data-layer="heat">heatmap</button>
          <button class="pg-chip pg-toggle on" data-layer="zero">zero set <span class="ktx" data-tex="\Omega_t^0"></span></button>
          <button class="pg-chip pg-toggle on" data-layer="ghost">buffer boundary</button>
          <button class="pg-chip pg-toggle on" data-layer="traj">trajectories</button>
          <button class="pg-chip pg-toggle" data-layer="pairs">pair emission</button>
          <button class="pg-chip pg-toggle on" data-layer="strip">terminal strip</button>
          <button class="pg-chip pg-toggle" data-layer="labels">labels</button>
        </div>
      </div>

      <div class="pg-group">
        <div class="pg-group-label">motion</div>
        <div class="pg-btn-row">
          <button class="pg-play" id="revBtn" aria-label="play in reverse"></button>
          <button class="pg-play" id="playBtn" aria-label="play or pause"></button>
          <div class="pg-chips" id="speedChips">
            <button class="pg-chip" data-speed="0.5">0.5&times;</button>
            <button class="pg-chip on" data-speed="1">1&times;</button>
            <button class="pg-chip" data-speed="2">2&times;</button>
          </div>
        </div>
        <div class="pg-slider-row">
          <input type="range" class="pg-range" id="timeRange" min="0" max="1" step="0.001" value="1" aria-label="time">
          <div class="pg-readout" id="timeReadout">t = 1.00</div>
        </div>
      </div>
    </aside>
  </main>


  <script type="module" src="1d.js"></script>
</body>
</html>
